version: 1
protocol: pose_v1

defaults:
  ack: "OK POSE"
  timeout_s: 6.0
  stop_on_failure: true

targets:
  apple:
    enabled: false
    disabled_reason: "Missing verified Apple lift POSE parameters"
    missing_parameters:
      - lift.x
      - lift.y
      - lift.z
      - lift.pitch
      - lift.roll
      - lift.claw
      - lift.time_ms
    steps:
      - name: grasp
        x: 29
        y: 4
        z: 14
        pitch: 0
        roll: 0
        claw: 40
        time_ms: 800

  bottle:
    enabled: false
    disabled_reason: "Missing verified Bottle grasp and lift POSE parameters"
    missing_parameters:
      - grasp.x
      - grasp.y
      - grasp.z
      - grasp.pitch
      - grasp.roll
      - grasp.claw
      - grasp.time_ms
      - lift.x
      - lift.y
      - lift.z
      - lift.pitch
      - lift.roll
      - lift.claw
      - lift.time_ms
    steps: []
