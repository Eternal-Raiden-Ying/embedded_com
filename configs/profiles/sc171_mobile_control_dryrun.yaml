profile: "sc171_mobile_control_dryrun"
runtime_overrides:
  vision:
    req_in: {transport: "disabled"}
    obs_out: {transport: "disabled"}
  orchestrator:
    runtime:
      config_profile: "sc171_mobile_control_dryrun"
    serial:
      dry_run: true
    arm_serial:
      dry_run: true
    vista:
      enabled: false
    task_cmd_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    task_ack_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_ack.sock"
    tts_event_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
  gateway:
    runtime:
      task_input_mode: "mobile"
      feedback_output_mode: "optional"
      mobile_task_commands_allowed: true
      mobile_manual_control_allowed: true
      mobile_core_control_allowed: true
      mobile_emergency_stop_allowed: true
    command_in: {transport: "disabled"}
    status_out: {transport: "disabled"}
    orchestrator_task_cmd_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    orchestrator_task_ack_in: {transport: "disabled"}
    tts_event_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
    tts_playback_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/tts_playback.sock"
    mqtt:
      enabled: true
      accept_commands: true
      retain_status: true
      retain_heartbeat: false
      tts_qos: 1
      topics:
        cmd: "robot/v1/SC171/mobile/cmd"
        ack: "robot/v1/SC171/mobile/ack"
        status: "robot/v1/SC171/mobile/status"
        heartbeat: "robot/v1/SC171/heartbeat"
        tts: "robot/v1/SC171/mobile/tts"
        tts_ack: "robot/v1/SC171/mobile/tts_ack"

voice_gateway:
  runtime:
    input_mode: mobile_only
    dry_run_text: true
  tts: {enabled: false}
  ipc:
    task_cmd_out:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_cmd.sock
    task_ack_in:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_ack.sock
    tts_event_in: {transport: disabled}
  mobile_feedback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/mobile_tts_event.sock
  playback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/tts_playback.sock
