profile: "sc171_voice_phone_tts_dryrun"
runtime_overrides:
  vision:
    runtime:
      keep_vision_alive_after_task: true
      keep_preview_alive_after_task: true
      release_model_on_idle: false
    req_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_req.sock"
    obs_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_obs.sock"
  orchestrator:
    runtime:
      config_profile: "sc171_voice_phone_tts_dryrun"
    serial:
      port: "DRY_RUN"
      dry_run: true
      readback_enabled: false
    arm_serial:
      dry_run: true
    task_cmd_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    task_ack_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_ack.sock"
    vision_obs_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_obs.sock"
    vision_req_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_req.sock"
    tts_feedback:
      enabled: true
      verbosity: detailed
      min_interval_s: 1.5
      default_ttl_s: 8.0
      dedupe_window_s: 30.0
      detailed_progress_enabled: true
    tts_event_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
    tts_playback_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/orchestrator_tts_playback.sock"
      async_enabled: true
  gateway:
    runtime:
      task_input_mode: "voice"
      feedback_output_mode: "phone_tts"
      mobile_task_commands_allowed: false
      mobile_manual_control_allowed: true
      mobile_core_control_allowed: true
      mobile_emergency_stop_allowed: true
    # MQTT is handled by MqttAdapter; these are framed-msgpack IPC endpoints.
    command_in: {transport: "disabled"}
    status_out: {transport: "disabled"}
    orchestrator_task_cmd_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    orchestrator_task_ack_in: {transport: "disabled"}
    tts_event_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
    tts_playback_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/tts_playback.sock"
    orchestrator_tts_playback_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/orchestrator_tts_playback.sock"
      send_mode: "oneshot"
      async_enabled: true
    mqtt:
      enabled: true
      accept_commands: true
      retain_status: true
      retain_heartbeat: false
      tts_qos: 1
      topics:
        cmd: "robot/v1/SC171/mobile/cmd"
        ack: "robot/v1/SC171/mobile/ack"
        status: "robot/v1/SC171/mobile/status"
        heartbeat: "robot/v1/SC171/heartbeat"
        tts: "robot/v1/SC171/mobile/tts"
        tts_ack: "robot/v1/SC171/mobile/tts_ack"
voice_gateway:
  runtime:
    input_mode: voice_only
    debug_input_only: false
    dry_run_text: false
    asr_warmup_enabled: true
    followup_secs: 8.0
  audio:
    device: "plughw:CARD=UACDemoV10,DEV=0"
    sample_rate: 16000
    channels: 1
    format: "S16_LE"
  kws:
    backend: sherpa_onnx
  asr:
    quantized: true
  vad:
    quantized: true
  tts: {enabled: false}
  ipc:
    task_cmd_out:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_cmd.sock
    task_ack_in:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_ack.sock
    tts_event_in: {transport: disabled}
  mobile_feedback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/mobile_tts_event.sock
  playback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/tts_playback.sock
    start_timeout_s: 1.5
    finish_timeout_s: 6.0
    post_guard_s: 0.35
