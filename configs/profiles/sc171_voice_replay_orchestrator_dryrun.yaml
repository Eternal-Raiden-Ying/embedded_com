profile: "sc171_voice_replay_orchestrator_dryrun"
runtime_overrides:
  vision:
    req_in: {transport: "disabled"}
    obs_out: {transport: "disabled"}
  orchestrator:
    runtime:
      config_profile: "sc171_voice_replay_orchestrator_dryrun"
    serial:
      port: "DRY_RUN"
      dry_run: true
      readback_enabled: false
    arm_serial:
      dry_run: true
    vista:
      enabled: false
    task_cmd_in: {transport: "uds", ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"}
    task_ack_out: {transport: "uds", ipc_socket_path: "/tmp/robot_stack/task_ack.sock"}
    vision_obs_in: {transport: "disabled"}
    vision_req_out: {transport: "disabled"}
    tts_event_out: {transport: "disabled"}
voice_gateway:
  runtime:
    input_mode: wav_replay
    debug_input_only: false
    dry_run_text: false
    replay_manifest: Voice/config/replay/find_apple.yaml
    replay_realtime: true
    replay_exit_after_complete: true
    replay_repeat: 1
    replay_fail_fast: true
    asr_warmup_enabled: true
  kws:
    backend: sherpa_onnx
  asr: {quantized: true, mode: offline}
  vad: {quantized: true}
  tts: {enabled: false}
  ipc:
    task_cmd_out: {transport: uds, ipc_socket_path: /tmp/robot_stack/task_cmd.sock}
    task_ack_in: {transport: uds, ipc_socket_path: /tmp/robot_stack/task_ack.sock}
    tts_event_in: {transport: disabled}
  mobile_feedback: {transport: disabled}
  playback: {transport: disabled}
