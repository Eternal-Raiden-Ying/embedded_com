profile: "sc171_voice_phone_tts"
runtime_overrides:
  vision:
    req_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_req.sock"
    obs_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_obs.sock"
  orchestrator:
    runtime:
      config_profile: "sc171_voice_phone_tts"
    serial:
      port: "/dev/ttyHS1"
      dry_run: false
      readback_enabled: true
    task_cmd_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    task_ack_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_ack.sock"
    vision_obs_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_obs.sock"
    vision_req_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/vision_req.sock"
    # The only TTS producer is the Orchestrator's existing tts_event stream.
    tts_feedback:
      enabled: true
      verbosity: detailed
      min_interval_s: 1.5
      default_ttl_s: 8.0
      dedupe_window_s: 30.0
      detailed_progress_enabled: true
    tts_event_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
      send_mode: "oneshot"
      async_enabled: true
  gateway:
    runtime:
      task_input_mode: "voice"
      feedback_output_mode: "phone_tts"
      mobile_task_commands_allowed: false
      mobile_manual_control_allowed: true
      mobile_core_control_allowed: true
      mobile_emergency_stop_allowed: true
    command_in:
      transport: "http"
      ipc_socket_path: "/tmp/robot_stack/mobile_gateway_cmd.sock"
      tcp_host: "0.0.0.0"
      tcp_port: 9001
    status_out:
      transport: "disabled"
    orchestrator_task_cmd_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/task_cmd.sock"
    orchestrator_task_ack_in:
      transport: "disabled"
    # The gateway is the UDS listener and is started before the Orchestrator.
    tts_event_in:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/mobile_tts_event.sock"
    tts_playback_out:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/tts_playback.sock"
      send_mode: "oneshot"
    mqtt:
      # Keep the mini-program FIND/debug command topic active in addition to
      # the tts_ack subscription. Broker credentials stay in the local MQTT file.
      accept_commands: true
      retain_status: true
      retain_heartbeat: false
      tts_qos: 1
      topics:
        cmd: "robot/v1/SC171/mobile/cmd"
        ack: "robot/v1/SC171/mobile/ack"
        status: "robot/v1/SC171/mobile/status"
        heartbeat: "robot/v1/SC171/heartbeat"
        tts: "robot/v1/SC171/mobile/tts"
        tts_ack: "robot/v1/SC171/mobile/tts_ack"
  online_edge:
    output:
      transport: "uds"
      ipc_socket_path: "/tmp/robot_stack/table_edge_obs.sock"

# Voice remains the USB KWS/VAD/ASR TaskCmd producer.  Local Piper playback is
# deliberately disabled: all user feedback comes from authoritative tts_event.
voice_gateway:
  runtime:
    input_mode: voice_only
    dry_run_text: false
    asr_warmup_enabled: true
    followup_secs: 8.0
  kws:
    frontend_backend: onnx
    classifier_backend: onnx
  asr:
    quantized: true
  vad:
    quantized: true
  tts:
    enabled: false
  ipc:
    task_cmd_out:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_cmd.sock
    task_ack_in:
      transport: uds
      ipc_socket_path: /tmp/robot_stack/task_ack.sock
    tts_event_in:
      transport: disabled
  mobile_feedback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/mobile_tts_event.sock
  playback:
    transport: uds
    ipc_socket_path: /tmp/robot_stack/tts_playback.sock
    start_timeout_s: 1.5
    finish_timeout_s: 6.0
    post_guard_s: 0.35
