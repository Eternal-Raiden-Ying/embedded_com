profile: "sc171_voice_phone_tts_online_asr"
base_profile: "sc171_voice_phone_tts"
voice_gateway:
  playback:
    wake_prompt_text: "我在，请说。"
    post_guard_s: 0.20
    command_pre_roll_ms: 480
    pre_roll_before_tts_finished_ms: 160
  kws:
    backend: sherpa_onnx
  asr:
    mode: online
    model_path: Voice/ONNX/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
    quantized: true
    chunk_size: [5, 10, 5]
    encoder_chunk_look_back: 4
    decoder_chunk_look_back: 1
    emit_partial: true
