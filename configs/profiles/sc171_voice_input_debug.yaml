profile: "sc171_voice_input_debug"
runtime_overrides:
  gateway:
    command_in: {transport: "disabled"}
    status_out: {transport: "disabled"}
    tts_event_in: {transport: "disabled"}
voice_gateway:
  runtime:
    input_mode: voice_only
    debug_input_only: true
    dry_run_text: false
    asr_warmup_enabled: true
  audio:
    device: "plughw:CARD=UACDemoV10,DEV=0"
    sample_rate: 16000
    channels: 1
    format: "S16_LE"
  kws:
    backend: sherpa_onnx
  asr:
    quantized: true
  vad:
    quantized: true
  tts: {enabled: false}
  ipc:
    task_cmd_out: {transport: disabled}
    task_ack_in: {transport: disabled}
    tts_event_in: {transport: disabled}
